<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Klok</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/css/app.css" />
  <style>
    .clock-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 26px 20px 48px;
      text-align: center;
    }

    .day-badge { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-muted); }

    .big-time {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-size: clamp(72px, 17vw, 210px);
      line-height: 0.92;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 0;
    }

    .session-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    .session {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--border);
      background: var(--surface-1);
      border-radius: 999px;
      padding: 8px 18px;
    }
    .session[data-open='true'] { border-color: rgba(12, 163, 12, 0.45); background: rgba(12, 163, 12, 0.08); }
    .session[data-open='false'] { border-color: rgba(208, 59, 59, 0.35); background: rgba(208, 59, 59, 0.06); }
    .session .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--down); flex: none; }
    .session[data-open='true'] .dot { background: var(--up); }
    .session .who { font-weight: 650; font-size: 15px; }
    .session .when { color: var(--text-secondary); font-size: 13px; font-variant-numeric: tabular-nums; }

    .timeline-wrap { width: min(860px, 100%); text-align: left; }

    .lane { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .lane .lane-name { width: 62px; font-size: 12px; color: var(--text-muted); flex: none; }
    .lane .track {
      position: relative;
      flex: 1;
      height: 12px;
      background: var(--surface-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .lane .win { position: absolute; top: 0; bottom: 0; }
    .lane .win.exchange { background: var(--accent); }
    .lane .win.casino { background: var(--warning); }
    .lane .elapsed { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(255, 255, 255, 0.14); }
    .lane .head { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }

    .hour-ticks {
      display: flex;
      justify-content: space-between;
      margin-left: 74px;
      font-size: 11px;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }

    .readouts {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      width: min(860px, 100%);
    }

    .panel { width: min(860px, 100%); text-align: left; }
    .preset-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .preset-row button[aria-pressed='true'] { background: var(--accent); border-color: transparent; color: #fff; }
  </style>
</head>
<body>
  <header class="topbar"></header>

  <main class="clock-stage">
    <div class="day-badge" id="day-badge">Speldag 1</div>
    <h1 class="big-time" id="big-time">--:--</h1>

    <div class="session-row">
      <div class="session" id="sess-exchange">
        <span class="dot"></span>
        <span class="who">Beurs</span>
        <span class="when" id="sess-exchange-when">–</span>
      </div>
      <div class="session" id="sess-casino">
        <span class="dot"></span>
        <span class="who">Casino</span>
        <span class="when" id="sess-casino-when">–</span>
      </div>
      <div class="session" id="sess-run" data-open="true">
        <span class="dot"></span>
        <span class="who" id="run-word">Loopt</span>
      </div>
    </div>

    <div class="timeline-wrap">
      <div class="lane">
        <span class="lane-name">Beurs</span>
        <div class="track">
          <div class="win exchange" id="win-exchange"></div>
          <div class="elapsed" id="elapsed-a"></div>
          <div class="head" id="head-a"></div>
        </div>
      </div>
      <div class="lane">
        <span class="lane-name">Casino</span>
        <div class="track">
          <div class="win casino" id="win-casino"></div>
          <div class="elapsed" id="elapsed-b"></div>
          <div class="head" id="head-b"></div>
        </div>
      </div>
      <div class="hour-ticks" id="hour-ticks"></div>
    </div>

    <div class="readouts">
      <div class="stat">
        <div class="label">Verstreken</div>
        <div class="value num" id="r-elapsed">–</div>
        <div class="sub" id="r-elapsed-sub">–</div>
      </div>
      <div class="stat">
        <div class="label">Tot einde dag</div>
        <div class="value num" id="r-close">–</div>
        <div class="sub">echte tijd</div>
      </div>
      <div class="stat">
        <div class="label">Eén speluur</div>
        <div class="value num" id="r-hour">–</div>
        <div class="sub">echte minuten</div>
      </div>
      <div class="stat">
        <div class="label">Hele dag</div>
        <div class="value num" id="r-daylen">–</div>
        <div class="sub" id="r-daylen-sub">echte tijd</div>
      </div>
    </div>

    <section class="card panel">
      <div class="card-head">
        <h2>Snelheid</h2>
        <div class="btn-row">
          <button id="btn-toggle" class="primary">Pauze</button>
          <button id="btn-skip" class="ghost">Meteen naar de volgende dag</button>
        </div>
      </div>

      <div class="field">
        <label>Hoeveel echte minuten duurt één speluur?</label>
        <div class="preset-row" id="preset">
          <button data-min="0.25" class="sm">15 sec</button>
          <button data-min="1" class="sm">1 min</button>
          <button data-min="2" class="sm">2 min</button>
          <button data-min="3" class="sm">3 min</button>
          <button data-min="5" class="sm">5 min</button>
          <button data-min="10" class="sm">10 min</button>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="hourlen">Zelf instellen — echte minuten per speluur</label>
          <input type="number" id="hourlen" min="0.05" max="120" step="0.25" />
        </div>
        <div class="field">
          <label for="jump">Klok verzetten naar</label>
          <input type="text" id="jump" placeholder="15:00" />
        </div>
        <button id="btn-apply" class="primary">Toepassen</button>
      </div>
      <p class="muted" id="plan-hint" style="margin: 10px 0 0; font-size: 12px;">–</p>
    </section>
  </main>

  <script type="module" src="/js/clock.js"></script>
</body>
</html>
